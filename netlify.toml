[build]
  command = "npm run build"
  publish = "dist"

# The site is fully prerendered, so there is deliberately NO SPA catch-all
# rewrite. Unknown paths must fall through to dist/404.html with a real 404
# status; a catch-all would turn every typo into a soft 200 and waste crawl
# budget.

# The CV is a second indexable document that competes with the homepage for
# the owner's name. Keep it reachable for humans, invisible to search.
[[headers]]
  for = "/Martin_Bogoje-CV.pdf"
  [headers.values]
    X-Robots-Tag = "noindex, noarchive"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Immutable, content-hashed build output.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Canonical host: force the apex domain so www does not split ranking signals.
[[redirects]]
  from = "https://www.bogojemartin.com/*"
  to = "https://bogojemartin.com/:splat"
  status = 301
  force = true

# Locale-specific 404s. Without these, Netlify serves the Croatian dist/404.html
# for every unknown path, including ones under /en/, /de/ and /pl/.
[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404

[[redirects]]
  from = "/de/*"
  to = "/de/404.html"
  status = 404

[[redirects]]
  from = "/pl/*"
  to = "/pl/404.html"
  status = 404
